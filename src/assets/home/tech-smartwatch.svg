<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="caseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="50%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="watchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Upper Band -->
  <path d="M 68 8 L 132 8 L 126 50 L 74 50 Z" fill="url(#bandGrad)" />
  <line x1="70" y1="20" x2="130" y2="20" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Lower Band -->
  <path d="M 74 150 L 126 150 L 132 192 L 68 192 Z" fill="url(#bandGrad)" />
  <line x1="70" y1="180" x2="130" y2="180" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Watch Body Case with Shadow -->
  <rect x="52" y="44" width="96" height="112" rx="28" fill="url(#caseGrad)" filter="url(#watchShadow)" stroke="#475569" stroke-width="2"/>

  <!-- Digital Crown -->
  <rect x="148" y="66" width="6" height="22" rx="3" fill="#64748B" stroke="#334155" stroke-width="1"/>
  <!-- Side Button -->
  <rect x="148" y="98" width="4" height="24" rx="2" fill="#475569"/>

  <!-- Screen Bezel & Display Area -->
  <rect x="59" y="51" width="82" height="98" rx="22" fill="#000000"/>

  <!-- Activity Rings Display -->
  <!-- Outer Ring (Move / Red-Pink) -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="#331422" stroke-width="6"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#FF0055" stroke-width="6" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="40" transform="rotate(-90 100 100)"/>

  <!-- Middle Ring (Exercise / Green) -->
  <circle cx="100" cy="100" r="21" fill="none" stroke="#12331C" stroke-width="6"/>
  <circle cx="100" cy="100" r="21" fill="none" stroke="#00FF66" stroke-width="6" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="35" transform="rotate(-90 100 100)"/>

  <!-- Inner Ring (Stand / Cyan) -->
  <circle cx="100" cy="100" r="12" fill="none" stroke="#0D2E3D" stroke-width="6"/>
  <circle cx="100" cy="100" r="12" fill="none" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="75.4" stroke-dashoffset="20" transform="rotate(-90 100 100)"/>

  <!-- Time Display -->
  <text x="100" y="70" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">10:09</text>
</svg>
